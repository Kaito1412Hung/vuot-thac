behaviors:
  SuoiRungBoat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0002
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    behavioral_cloning:
      demo_path: Training/Demos-allboats
      strength: 1.0
      steps: 80000
      num_epoch: 3
      batch_size: 256
      samples_per_update: 16384
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 80000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 40000
    keep_checkpoints: 3
environment_parameters:
  episode_length: 1400
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 0
torch_settings:
  device: cpu
