behaviors:
  SuoiRungBoat:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.002
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    behavioral_cloning:
      demo_path: Training/Demos
      strength: 0.7
      steps: 150000
      num_epoch: 3
      batch_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 300000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000
    keep_checkpoints: 5
environment_parameters:
  episode_length:
    curriculum:
      - name: ShortRoutes
        completion_criteria:
          measure: reward
          behavior: SuoiRungBoat
          min_lesson_length: 100
          threshold: 3.2
        value: 90
      - name: MediumRoutes
        completion_criteria:
          measure: reward
          behavior: SuoiRungBoat
          min_lesson_length: 100
          threshold: 6.0
        value: 180
      - name: LongRoutes
        completion_criteria:
          measure: reward
          behavior: SuoiRungBoat
          min_lesson_length: 100
          threshold: 12.0
        value: 400
      - name: CompleteCourse
        value: 1400
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 0
torch_settings:
  device: cpu
